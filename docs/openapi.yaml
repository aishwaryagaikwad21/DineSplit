openapi: 3.0.3

info:
  title: DineSplit API
  version: 1.0.0
  description: API for DineSplit

servers:
  - url: http://localhost:3000

paths:

  /api/restaurants/register:
    post:
      summary: Register a restaurant
      description: creates a new restaurant account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
              
                name:
                  type: string
                
                address:
                  type: string
                
                email:
                  type: string
                  format: email
                
                password:
                  type: string
                
                socialMediaHandles:
                  type: object

              required:
                - name
                - address
                - email
                - password        
            example:
              name: "The Food House"
              address: "Pune, Maharashtra"
              email: "restaurant@example.com"
              password: "StrongPassword123!"
              socialMediaHandles:
                instagram: "thefoodhouse"

      responses:

        "201":
          description: Restaurant registered successfully

        "400":
          description: Invalid registration data

        "409":
          description: Restaurant with this email already exists
        
        "500":
          description: Internal server error